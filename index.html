<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#f2eada">
  <meta name="description" content="Éclat — un jeu de craft du silex aux étoiles. Découvre les recettes par le geste, traverse les âges, perce le secret de l’étoile rouge.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Éclat">
  <title>Éclat — du silex aux étoiles</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/theme.css">
</head>
<body>
  <div id="app">
    <header id="top">
      <div id="orn" aria-hidden="true"></div>
      <div class="age"><span id="ageName">Âge du Bois</span><small id="ageNum">Âge 1/13</small></div>
      <div class="top-right">
        <button id="tutoMini" class="exp-mini hidden" aria-label="Rouvrir le conseil">💭</button>
        <button id="handMini" class="exp-mini hidden" aria-label="Fabrication en cours"></button>
        <button id="expMini" class="exp-mini hidden" aria-label="Exploration en cours"></button>
        <button id="cloudBtn" class="icon-btn cloud hidden" aria-label="Compte en ligne">☁️</button>
        <button id="memBtn" class="chip mem hidden" aria-label="Mémoire des mains">✦ <b id="memN">0</b></button>
        <button id="intuBtn" class="chip intu" aria-label="Intuition">✨ <b id="intu">0</b></button>
        <button id="menuBtn" class="icon-btn" aria-label="Menu">☰</button>
      </div>
    </header>
    <div id="updBar" class="upd hidden" role="status"></div>
    <main id="views">
      <section id="v-domaine" class="view"></section>
      <section id="v-atelier" class="view"></section>
      <section id="v-carnet" class="view"></section>
      <section id="v-carte" class="view"></section>
      <section id="v-journal" class="view"></section>
      <section id="v-cosmos" class="view"></section>
    </main>
    <nav id="tabs">
      <button data-tab="domaine"><svg class="gi" aria-hidden="true"><use href="#gi-village"/></svg><span>Domaine</span></button>
      <button data-tab="carte"><svg class="gi" aria-hidden="true"><use href="#gi-treasure-map"/></svg><span>Carte</span></button>
      <button data-tab="atelier"><svg class="gi" aria-hidden="true"><use href="#gi-hammer-nails"/></svg><span>Atelier</span></button>
      <button data-tab="carnet"><svg class="gi" aria-hidden="true"><use href="#gi-notebook"/></svg><span>Carnet</span></button>
      <button data-tab="journal"><svg class="gi" aria-hidden="true"><use href="#gi-scroll-quill"/></svg><span>Journal</span></button>
      <button data-tab="cosmos" class="hidden"><svg class="gi" aria-hidden="true"><use href="#gi-galaxy"/></svg><span>Cosmos</span></button>
    </nav>
  </div>
  <div id="modal" class="modal hidden"><div class="modal-box" role="dialog" aria-modal="true"></div></div>
  <div id="toasts" aria-live="polite"></div>
  <div id="fx"></div>
  <noscript><p style="padding:20px">Éclat a besoin de JavaScript pour fonctionner.</p></noscript>
  <script src="js/config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/sky.js"></script>
  <script src="js/scenes.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/domaine.js"></script>
  <script src="js/carte.js"></script>
  <script src="js/roue.js"></script>
  <script src="js/tuto.js"></script>
  <script src="js/cloud.js"></script>
  <script src="js/ui.js"></script>
</body>
</html>
