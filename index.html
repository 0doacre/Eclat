  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <style>/* Les éléments de comparaison Atlas ne s’affichent pas en mode classique. */ .atlas-only,.atlas-map-heading,.atlas-map-footer,.atlas-landscape,.atlas-terrain,.atlas-compass{display:none}</style>
  <link id="atlasStylesheet" rel="stylesheet" href="css/design-preview.css">
  <link id="atlasMapStylesheet" rel="stylesheet" href="css/carte-atlas.css">
  <link id="vivantStylesheet" rel="stylesheet" href="css/domaine-vivant.css">

</head>
<body>
  <div id="app">
    <header id="top">
      <div id="orn" aria-hidden="true"></div>
      <button class="age" id="ageBtn" title="Toucher pour voir les étapes de cet âge">
        <span class="age-head"><span id="ageName">Bois</span><span class="age-sub"><small id="ageNum">Âge 1/13</small><span id="ageProgBadge" class="age-badge">0/5</span></span></span>
        <span class="age-bar-track"><i id="ageBar" class="age-bar-fill" style="width:0%"></i></span>
      </button>
      <div class="top-right">
        <button id="atlasToggle" class="icon-btn" type="button" aria-label="Passer au style classique" title="Comparer : Atlas / Classique" style="font-size:12px;font-weight:700;min-width:44px;width:auto;padding:0 6px">Atlas</button>
        <button id="tutoMini" class="exp-mini hidden" aria-label="Rouvrir le conseil">💭</button>
        <button id="expMini" class="exp-mini hidden" aria-label="Exploration en cours"></button>
        <button id="questBtn" class="chip quest" aria-label="Quêtes" title="Quêtes : l’objectif, les rituels, le Troqueur">📜 <span class="cv"><b id="questBadge">Quêtes</b><small id="questSub">0/3</small></span><span id="questDot" class="quest-dot hidden">●</span></button>
        <button id="cloudBtn" class="icon-btn cloud hidden" aria-label="Compte en ligne">☁️</button>
        <button id="memBtn" class="chip mem hidden" aria-label="Traces et Mémoire des mains">✦ <span class="cv"><b id="memN">0</b><small>Traces</small></span></button>
        <button id="intuBtn" class="chip intu" aria-label="Intuition">✨ <span class="cv"><b id="intu">0</b><small>Intuition</small></span></button>
        <button id="menuBtn" class="icon-btn" aria-label="Menu">☰</button>
      </div>
    </header>
    <div id="ambianceBar" class="amb-bar" role="status" aria-live="off" title="Toucher pour changer d’ambiance"><span id="ambTxt" class="amb-txt"></span></div>
    <div id="updBar" class="upd hidden" role="status"></div>
    <div id="saveBar" class="upd hidden" role="alert"></div>
    <main id="views">
      <section id="v-domaine" class="view"></section>
      <section id="v-atelier" class="view"></section>
      <section id="v-arbre" class="view"></section>
      <section id="v-carnet" class="view"></section>
      <section id="v-machines" class="view"></section>
      <section id="v-carte" class="view"></section>
      <section id="v-journal" class="view"></section>
      <section id="v-cosmos" class="view"></section>
    </main>
    <div id="actbar" class="actbar hidden" aria-label="Activités en cours"></div>
    <nav id="tabs">
      <button data-tab="domaine" title="Tes terres, tes gisements et ce qu’ils produisent"><svg class="gi" aria-hidden="true"><use href="#gi-village"/></svg><span>Domaine</span></button>
      <button data-tab="carte" title="Le monde, terre par terre, et ce qu’il reste à explorer"><svg class="gi" aria-hidden="true"><use href="#gi-treasure-map"/></svg><span>Carte</span></button>
      <button data-tab="atelier" title="Poser tes ressources, lancer une action"><svg class="gi" aria-hidden="true"><use href="#gi-hammer-nails"/></svg><span>Atelier</span></button>
      <button data-tab="arbre" class="hidden" title="Qui sert à quoi : une recette, ses ingrédients, ses usages"><svg class="gi" aria-hidden="true"><use href="#gi-tree-branch"/></svg><span>Arbre</span></button>
      <button data-tab="carnet" class="hidden" title="Toutes tes recettes, avec la quantité et les commandes"><svg class="gi" aria-hidden="true"><use href="#gi-open-book"/></svg><span>Carnet</span></button>
      <button data-tab="journal" class="hidden" title="Ce que tu as trouvé et compris"><svg class="gi" aria-hidden="true"><use href="#gi-scroll-quill"/></svg><span>Journal</span></button>
    </nav>
  </div>
  <div id="modal" class="modal hidden"><div class="modal-box" role="dialog" aria-modal="true"></div></div>
  <div id="toasts" aria-live="polite"></div>
  <div id="fx"></div>
  <noscript><p style="padding:20px">Éclat a besoin de JavaScript pour fonctionner.</p></noscript>
  <script>
    /* Comparaison visuelle sans toucher aux sauvegardes ni à la progression.
     * Trois modes cycliques : "atlas" (défaut actuel) -> "vivant" (nœuds immersifs) -> "classique" (historique). */
    (function () {
      const key = "eclat.preview.style";
      const sheet = document.getElementById("atlasStylesheet");
      const vivantSheet = document.getElementById("vivantStylesheet");
      const button = document.getElementById("atlasToggle");
      const MODES = ["atlas", "vivant", "classique"];

      function apply(mode) {
        if (!MODES.includes(mode)) mode = "atlas";
        const isClassic = mode === "classique";
        const isVivant = mode === "vivant";
        sheet.disabled = isClassic;
        if (vivantSheet) vivantSheet.disabled = !isVivant;
        document.documentElement.setAttribute("data-style-mode", mode);
        window.EclatStyleMode = mode;

        const game = window.__eclat;
        if (game) {
          if (game.applyTheme) game.applyTheme();
          game.render(true);
          const map = document.querySelector("#v-carte .carte-svg");
          const views = document.getElementById("views");
          if (map && views && document.getElementById("v-carte").classList.contains("on")) {
            requestAnimationFrame(function () {
              const offset = map.getBoundingClientRect().top - views.getBoundingClientRect().top + views.scrollTop;
              views.scrollTop = Math.max(0, offset + map.getBoundingClientRect().height * game.Carte.focusY(game.U.zone) - views.clientHeight * .55);
            });
          }
        }

        if (mode === "atlas") {
          button.textContent = "Atlas";
          button.setAttribute("aria-label", "Activer le Carnet du Semeur");
          button.setAttribute("aria-pressed", "true");
          button.title = "Style Atlas actif — toucher pour Carnet";
        } else if (mode === "vivant") {
          button.textContent = "Carnet";
          button.setAttribute("aria-label", "Revenir au style classique");
          button.setAttribute("aria-pressed", "true");
          button.title = "Carnet du Semeur actif — toucher pour Classique";
        } else {
          button.textContent = "Class.";
          button.setAttribute("aria-label", "Activer le style Atlas vivant");
          button.setAttribute("aria-pressed", "false");
          button.title = "Style classique actif — toucher pour Atlas";
        }
        try { localStorage.setItem(key, mode); } catch (_) {}
      }

      let mode = "atlas";
      try {
        const saved = localStorage.getItem(key);
        if (MODES.includes(saved)) mode = saved;
      } catch (_) {}
      apply(mode);

      button.addEventListener("click", function () {
        const cur = window.EclatStyleMode || "atlas";
        const idx = MODES.indexOf(cur);
        const next = MODES[(idx + 1) % MODES.length];
        apply(next);
      });
    })();
  </script>
